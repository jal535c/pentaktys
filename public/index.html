<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pentaktys Online</title>
    <link rel="icon" href="favicon.ico">
    <style>
        :root {
            --bg-color: #5b6b83; --board-bg: #0f172a; --line-color: #334155; --text-color: #f1f5f9; 
            --c-magenta: #9D4EDD; --c-rojo: #E63946; --c-verde: #2A9D8F; --c-azul: #4361EE; --c-naranja: #F4A261; 
            --ficha-j1: #f8fafc; --ficha-j2: #0f172a; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color);
            min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; gap: 30px; padding: 30px 20px; touch-action: none; overflow: hidden;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; text-align: center; }

        #login-screen { display: flex; flex-direction: column; align-items: center; gap: 30px; width: 100%; max-width: 400px; }
        #login-screen input {
            padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 2px solid var(--text-color); 
            background-color: transparent; color: var(--text-color); text-align: center; outline: none; width: 100%;
        }
        #login-screen button {
            padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 8px;
            background-color: var(--text-color); color: var(--bg-color); font-weight: bold; width: 100%;
        }
        #waiting-text { color: #cbd5e1; font-size: 1.2rem; display: none; text-align: center; }
        
        /* Guía de Colores */
        #rules-guide { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .rule-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; text-align: left; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }

        .ui-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; background-color: rgba(15, 23, 42, 0.5); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(241, 245, 249, 0.1); }
        .indicator { display: flex; flex-direction: column; align-items: center; }
        .indicator-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #cbd5e1; margin-bottom: 4px; }
        .indicator-value { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .turn-dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
        .turn-dot.j1 { background-color: var(--ficha-j1); }
        .turn-dot.j2 { background-color: var(--ficha-j2); }

        .board-container { width: 100%; max-width: 500px; aspect-ratio: 1 / 1; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 4px; width: 100%; height: 100%; background-color: var(--line-color); border: 4px solid var(--line-color); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); }
        .cell { display: flex; align-items: center; justify-content: center; position: relative; transition: filter 0.2s, background-color 0.3s; overflow: hidden; }
        .cell.drag-over { filter: brightness(1.5); }
        .cell.empty { background-color: var(--bg-color) !important; }
        .marks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.5; z-index: 1; transition: opacity 0.3s; }
        .cell.empty .marks { opacity: 0; }
        .piece-wrapper { width: 65%; height: 65%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; cursor: grab; }
        .piece { width: 100%; height: 100%; border-radius: 50%; transition: transform 0.1s ease, opacity 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3); border: 2px solid rgba(0,0,0,0.3); pointer-events: none; }
        .piece-wrapper:active .piece { transform: scale(0.95); }
        .piece.dragging { opacity: 0.2; }
        .piece-wrapper.locked { opacity: 0.6; cursor: not-allowed; }
        .piece.j1 { background-color: var(--ficha-j1); border-color: #cbd5e1; }
        .piece.j2 { background-color: var(--ficha-j2); border-color: #334155; }
        .controls { margin-top: 0; }
        button { padding: 10px 20px; font-size: 1rem; background-color: transparent; color: var(--text-color); border: 1px solid var(--text-color); border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        button:hover { background-color: var(--text-color); color: var(--bg-color); }
        .drag-ghost { position: fixed; pointer-events: none; z-index: 9999; opacity: 0.8; transform: scale(1.1); transition: none; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 65px; height: 65px; border-radius: 50%; }

        #result-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; }
        #result-content { background-color: var(--board-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--text-color); text-align: center; display: flex; flex-direction: column; gap: 20px; }
        #result-title { font-size: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        #winner-name { font-size: 2rem; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Pentaktys Online</h1>
        <input type="text" id="name-input" placeholder="Tu nombre" maxlength="12">
        <button id="play-btn">JUGAR</button>
        <div id="waiting-text">Esperando a tu oponente...</div>
        
        <div id="rules-guide">
            <div class="rule-item"><div class="color-dot" style="background: var(--c-magenta);"></div>1 casilla ortogonal (arriba, abajo, izq, der)</div>
            <div class="rule-item"><div class="color-dot" style="background: var(--c-rojo);"></div>2 casillas ortogonales (salta)</div>
            <div class="rule-item"><div class="color-dot" style="background: var(--c-azul);"></div>1 casilla diagonal</div>
            <div class="rule-item"><div class="color-dot" style="background: var(--c-verde);"></div>2 casillas diagonales (salta)</div>
            <div class="rule-item"><div class="color-dot" style="background: var(--c-naranja);"></div>En forma de L (como el caballo de ajedrez)</div>
        </div>
    </div>

    <h1 id="game-title" style="display: none;">Pentaktys</h1>
    <div class="ui-container" id="game-ui" style="display: none;">
        <div class="indicator">
            <span class="indicator-label">Turno</span>
            <span class="indicator-value" id="turnIndicator">
                <span class="turn-dot j1"></span>Esperando...
            </span>
        </div>
        <div class="indicator">
            <span class="indicator-label">Movimientos Restantes</span>
            <span class="indicator-value" id="roundIndicator">15</span>
        </div>
    </div>
    <div class="board-container" id="game-board-container" style="display: none;">
        <div class="board" id="board"></div>
    </div>
    <div class="controls" id="game-controls" style="display: none;">
        <button id="restart-btn">Reiniciar Partida</button>
    </div>

    <div id="result-screen">
        <div id="result-content">
            <div id="result-title">Fin de la Partida</div>
            <div id="winner-name">Ganador: -</div>
            <button id="accept-btn">Aceptar</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRole = 0; 
        let player1Name = "Jugador 1";
        let player2Name = "Jugador 2";
        let roomId = null;

        const boardElement = document.getElementById('board');
        const turnIndicator = document.getElementById('turnIndicator');
        const roundIndicator = document.getElementById('roundIndicator');
        
        // Mapeo de nombres de colores a variables CSS
        const colorMap = {
            'morado': 'var(--c-magenta)',
            'rojo': 'var(--c-rojo)',
            'verde': 'var(--c-verde)',
            'azul': 'var(--c-azul)',
            'naranja': 'var(--c-naranja)'
        };
        
        let draggedPieceWrapper = null, ghostElement = null, originCell = null, originBgColor = null, originRow = -1, originCol = -1;
        let currentTurn = 1, movesLeft = 15;
        let isSyncing = false;

        document.getElementById('play-btn').addEventListener('click', () => {
            const input = document.getElementById('name-input');
            if (input.value.trim() === "") { alert("Por favor, escribe tu nombre"); return; }
            
            document.getElementById('play-btn').style.display = 'none';
            input.style.display = 'none';
            document.getElementById('waiting-text').style.display = 'block';
            socket.emit('player_ready', input.value.trim());
        });

        socket.on('game_start', (gameData, role) => {
            myRole = role;
            roomId = gameData.roomId;
            player1Name = gameData.player1Name; 
            player2Name = gameData.player2Name;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-title').style.display = 'block';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-board-container').style.display = 'block';
            document.getElementById('game-controls').style.display = 'block';

            initGame(gameData.board); // El servidor envía el tablero ya calculado
        });

        socket.on('game_restart', (data) => {
            isSyncing = true;
            initGame(data.board); // Recibir nuevo tablero del servidor
            isSyncing = false;
            document.getElementById('result-screen').style.display = 'none'; 
        });

        socket.on('opponent_move', (moveData) => {
            isSyncing = true;
            const fromCell = document.querySelector(`.cell[data-row="${moveData.fromRow}"][data-col="${moveData.fromCol}"]`);
            const toCell = document.querySelector(`.cell[data-row="${moveData.toRow}"][data-col="${moveData.toCol}"]`);
            const pieceWrapper = fromCell.querySelector('.piece-wrapper');

            if (moveData.wasEmptyConsumed) {
                fromCell.classList.add('empty');
                fromCell.style.backgroundColor = '';
            }
            const targetPiece = toCell.querySelector('.piece-wrapper');
            if (targetPiece) toCell.removeChild(targetPiece);

            toCell.appendChild(pieceWrapper);
            changeTurn();
            isSyncing = false;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            if (confirm('¿Reiniciar la partida? Esto afectará a ambos jugadores.')) {
                socket.emit('restart_game', roomId);
            }
        });

        document.getElementById('accept-btn').addEventListener('click', () => {
            document.getElementById('result-screen').style.display = 'none';
        });

        function getMarksSVG(colorName) {
            let lines = '';
            let svg = `<svg class="marks" viewBox="0 0 100 100" preserveAspectRatio="none">`;
            if (colorName === 'morado') lines = `<line x1="10" y1="50" x2="90" y2="50" stroke="rgba(255,255,255,0.8)" stroke-width="4"/>`;
            else if (colorName === 'rojo') lines = `<line x1="10" y1="35" x2="90" y2="35" stroke="rgba(255,255,255,0.8)" stroke-width="4"/><line x1="10" y1="65" x2="90" y2="65" stroke="rgba(255,255,255,0.8)" stroke-width="4"/>`;
            else if (colorName === 'azul') lines = `<line x1="20" y1="80" x2="80" y2="20" stroke="rgba(255,255,255,0.8)" stroke-width="4"/>`;
            else if (colorName === 'verde') lines = `<line x1="20" y1="70" x2="70" y2="20" stroke="rgba(255,255,255,0.8)" stroke-width="4"/><line x1="30" y1="80" x2="80" y2="30" stroke="rgba(255,255,255,0.8)" stroke-width="4"/>`;
            svg += lines + `</svg>`;
            return svg;
        }

        function initGame(boardData) {
            boardElement.innerHTML = '';
            currentTurn = 1;
            movesLeft = 15;
            updateUI();

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r; cell.dataset.col = c;
                    
                    let colorName = boardData[r][c]; // Ej: 'morado'
                    cell.style.backgroundColor = colorMap[colorName];
                    cell.dataset.originalColor = colorName; // Guardamos el nombre del color
                    cell.innerHTML = getMarksSVG(colorName);
                    boardElement.appendChild(cell);
                }
            }
            for (let i = 0; i < 5; i++) createPiece(boardElement.children[i], 1);
            for (let i = 20; i < 25; i++) createPiece(boardElement.children[i], 2);
            updateLocks();
        }

        function createPiece(parentCell, player) {
            const wrapper = document.createElement('div');
            wrapper.className = 'piece-wrapper';
            wrapper.dataset.player = player;
            const piece = document.createElement('div');
            piece.className = `piece j${player}`;
            wrapper.appendChild(piece);
            wrapper.addEventListener('pointerdown', handlePointerDown);
            wrapper.addEventListener('dragstart', (e) => e.preventDefault());
            parentCell.appendChild(wrapper);
        }

        function updateUI() {
            if (currentTurn === 1) {
                turnIndicator.innerHTML = `<span class="turn-dot j1"></span>${player1Name}`;
            } else {
                turnIndicator.innerHTML = `<span class="turn-dot j2"></span>${player2Name}`;
            }
            roundIndicator.innerText = Math.max(0, movesLeft);
        }

        function updateLocks() {
            document.querySelectorAll('.piece-wrapper').forEach(p => {
                if (parseInt(p.dataset.player) === currentTurn && currentTurn === myRole) {
                    p.classList.remove('locked');
                } else {
                    p.classList.add('locked');
                }
            });
        }

        function changeTurn() {
            if (movesLeft > 0) movesLeft--;
            currentTurn = currentTurn === 1 ? 2 : 1;
            updateUI();
            updateLocks();
            checkGameEnd();
        }

        function checkGameEnd() {
            let p1Pieces = document.querySelectorAll('.piece-wrapper[data-player="1"]').length;
            let p2Pieces = document.querySelectorAll('.piece-wrapper[data-player="2"]').length;

            if (p1Pieces === 0) {
                endGame(2);
            } else if (p2Pieces === 0) {
                endGame(1);
            } else {
                if (!hasValidMoves(currentTurn)) {
                    endGame(currentTurn === 1 ? 2 : 1);
                }
            }
        }

        function hasValidMoves(player) {
            let pieces = document.querySelectorAll(`.piece-wrapper[data-player="${player}"]`);
            for (let piece of pieces) {
                let cell = piece.parentNode;
                let r1 = parseInt(cell.dataset.row);
                let c1 = parseInt(cell.dataset.col);
                let colorName = cell.dataset.originalColor;

                let allCells = document.querySelectorAll('.cell');
                for (let targetCell of allCells) {
                    if (targetCell === cell || targetCell.classList.contains('empty')) continue;
                    let r2 = parseInt(targetCell.dataset.row);
                    let c2 = parseInt(targetCell.dataset.col);
                    
                    if (isValidMove(colorName, r1, c1, r2, c2)) {
                        let targetPiece = targetCell.querySelector('.piece-wrapper');
                        if (!targetPiece || parseInt(targetPiece.dataset.player) !== player) {
                            return true; 
                        }
                    }
                }
            }
            return false; 
        }

        function endGame(winnerRole) {
            const winnerName = winnerRole === 1 ? player1Name : player2Name;
            document.getElementById('winner-name').innerText = `¡Ganador: ${winnerName}!`;
            document.getElementById('result-screen').style.display = 'flex';
            updateLocks(); 
        }

        function handlePointerDown(e) {
            const wrapper = e.currentTarget;
            if (wrapper.classList.contains('locked')) return;
            e.preventDefault();
            draggedPieceWrapper = wrapper;
            originCell = wrapper.parentNode;
            originRow = parseInt(originCell.dataset.row);
            originCol = parseInt(originCell.dataset.col);
            
            if (movesLeft === 0) {
                originBgColor = originCell.style.backgroundColor;
                originCell.classList.add('empty'); 
                originCell.style.backgroundColor = ''; 
            }
            const pieceElement = wrapper.querySelector('.piece');
            pieceElement.classList.add('dragging');
            ghostElement = pieceElement.cloneNode(true);
            ghostElement.classList.remove('dragging');
            ghostElement.classList.add('drag-ghost');
            const rect = pieceElement.getBoundingClientRect();
            ghostElement.style.width = rect.width + 'px';
            ghostElement.style.height = rect.height + 'px';
            document.body.appendChild(ghostElement);
            moveGhost(e.clientX, e.clientY);
            document.addEventListener('pointermove', handlePointerMove);
            document.addEventListener('pointerup', handlePointerUp);
            document.addEventListener('pointercancel', handlePointerUp);
        }

        function moveGhost(x, y) {
            if (ghostElement) {
                const rect = ghostElement.getBoundingClientRect();
                ghostElement.style.left = (x - rect.width / 2) + 'px';
                ghostElement.style.top = (y - rect.height / 2) + 'px';
            }
        }

        function handlePointerMove(e) {
            if (!draggedPieceWrapper) return;
            e.preventDefault();
            moveGhost(e.clientX, e.clientY);
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('drag-over'));
            ghostElement.style.display = 'none';
            const elementBelow = document.elementFromPoint(e.clientX, e.clientY);
            ghostElement.style.display = '';
            if (elementBelow) {
                const cellBelow = elementBelow.closest('.cell');
                if (cellBelow && !cellBelow.classList.contains('empty') && cellBelow !== originCell) {
                    const targetPiece = cellBelow.querySelector('.piece-wrapper');
                    if (!targetPiece || parseInt(targetPiece.dataset.player) !== currentTurn) {
                        cellBelow.classList.add('drag-over');
                    }
                }
            }
        }

        function isValidMove(colorName, r1, c1, r2, c2) {
            const dr = r2 - r1, dc = c2 - c1, absDr = Math.abs(dr), absDc = Math.abs(dc);
            if (colorName === 'morado') return (absDr === 1 && absDc === 0) || (absDr === 0 && absDc === 1);
            if (colorName === 'rojo') return (absDr === 2 && absDc === 0) || (absDr === 0 && absDc === 2);
            if (colorName === 'azul') return absDr === 1 && absDc === 1;
            if (colorName === 'verde') return absDr === 2 && absDc === 2;
            if (colorName === 'naranja') return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
            return false;
        }

        function handlePointerUp(e) {
            if (!draggedPieceWrapper) return;
            ghostElement.style.display = 'none';
            const elementBelow = document.elementFromPoint(e.clientX, e.clientY);
            let moveSuccessful = false;
            let targetCell = null;

            if (elementBelow) {
                targetCell = elementBelow.closest('.cell');
                if (targetCell && !targetCell.classList.contains('empty') && targetCell !== originCell) {
                    const targetPieceWrapper = targetCell.querySelector('.piece-wrapper');
                    if (!targetPieceWrapper || parseInt(targetPieceWrapper.dataset.player) !== currentTurn) {
                        const targetRow = parseInt(targetCell.dataset.row);
                        const targetCol = parseInt(targetCell.dataset.col);
                        if (isValidMove(originCell.dataset.originalColor, originRow, originCol, targetRow, targetCol)) {
                            if (targetPieceWrapper) targetCell.removeChild(targetPieceWrapper); 
                            targetCell.appendChild(draggedPieceWrapper);
                            moveSuccessful = true;
                        }
                    }
                }
            }

            draggedPieceWrapper.querySelector('.piece').classList.remove('dragging');
            if (ghostElement) { document.body.removeChild(ghostElement); ghostElement = null; }
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('drag-over'));

            if (moveSuccessful) {
                if (!isSyncing) {
                    socket.emit('make_move', {
                        roomId: roomId,
                        fromRow: originRow,
                        fromCol: originCol,
                        toRow: parseInt(targetCell.dataset.row),
                        toCol: parseInt(targetCell.dataset.col),
                        wasEmptyConsumed: movesLeft === 0
                    });
                }
                changeTurn();
            } else {
                if (originBgColor) {
                    originCell.classList.remove('empty');
                    originCell.style.backgroundColor = originBgColor;
                }
            }

            draggedPieceWrapper = null; originCell = null; originBgColor = null; originRow = -1; originCol = -1;
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            document.removeEventListener('pointercancel', handlePointerUp);
        }
    </script>
</body>
</html>
